{{- include "mendicant-agent.validateCache" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mendicant-agent
  labels:
    app.kubernetes.io/name: mendicant-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Two pods sharing one agent identity would compete for the same durable claim slot.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mendicant-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mendicant-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ printf "%s@%s" .Values.image.repository (required "image.digest is required" .Values.image.digest) | quote }}
          env:
            - name: MENDICANT_DATABASE_STORE
              value: /var/lib/mendicant/database
            - name: MENDICANT_DATABASE_STORE_MAX_BYTES
              value: {{ .Values.cache.maxBytes | quote }}
            - name: MENDICANT_SERVER_URL
              value: {{ required "serverURL is required" .Values.serverURL | quote }}
            - name: MENDICANT_AGENT_TOKEN_FILE
              value: /run/agent/token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database-cache
              mountPath: /var/lib/mendicant/database
            - name: scratch
              mountPath: /tmp
            - name: credential
              mountPath: /run/agent
              readOnly: true
            {{- if .Values.discovery.enabled }}
            - name: argocd-discovery
              mountPath: /run/argocd
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: database-cache
          {{- if eq .Values.cache.mode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ default "mendicant-agent-cache" .Values.cache.existingClaim | quote }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.cache.size | quote }}
          {{- end }}
        - name: scratch
          emptyDir:
            sizeLimit: 2Gi
        - name: credential
          secret:
            secretName: {{ .Values.token.secretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.token.key }}
                path: token

        {{- if .Values.discovery.enabled }}
        - name: argocd-discovery
          secret:
            secretName: {{ required "discovery.secretName is required" .Values.discovery.secretName }}
            defaultMode: 0440
            items:
              - key: token
                path: token
              - key: server-url
                path: server-url
        {{- end }}
