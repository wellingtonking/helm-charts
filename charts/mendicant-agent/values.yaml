enabled: true
replicaCount: 1
image:
  repository: ghcr.io/wellingtonking/app-mendicant/agent
  digest: ""
  pullSecrets: []
serverURL: ""
token:
  secretName: mendicant-development-tokens
  key: wk-agent

# Enable only after the user-managed ArgoCD credential item is available.
discovery:
  integrationKey: ""
  destinations: {}
  enabled: false
  secretName: mendicant-argocd-discovery
  onePasswordItemPath: ""

# Dedicated database snapshots, never mounted over immutable /app/cache.
cache:
  mode: pvc
  size: 8Gi
  maxBytes: "4294967296"
  existingClaim: ""
  storageClass: ""

# Provision a separate ArgoCD Application-update credential before enabling.
publication:
  enabled: false
  secretName: mendicant-argocd-publication
  onePasswordItemPath: ""
  publicURL: ""

# Dedicated scanner credentials. A rule without a repository is the host default.
registryAccess:
  credentials: {}
  rules: []
