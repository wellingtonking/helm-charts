apiVersion: apps/v1
kind: Deployment
metadata:
  name: mendicant-server
  labels:
    {{- include "mendicant.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mendicant.labels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "mendicant.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "mendicant.image" . | quote }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MENDICANT_SCHEDULER_ENABLED
              value: {{ .Values.scheduler.enabled | quote }}
            - name: MENDICANT_REASSESSMENT_INTERVAL_SECONDS
              value: {{ .Values.scheduler.reassessmentIntervalSeconds | quote }}
            - name: MENDICANT_DATABASE_REFRESH_INTERVAL_SECONDS
              value: {{ .Values.scheduler.databaseRefreshIntervalSeconds | quote }}
            - name: MENDICANT_SCHEDULER_POLL_SECONDS
              value: {{ .Values.scheduler.pollSeconds | quote }}
            - name: MENDICANT_DATABASE_URL_FILE
              value: /run/database/runtime-url
            - name: MENDICANT_DATABASE_PASSWORD_FILE
              value: /run/database/runtime-password
          volumeMounts:
            - name: database
              mountPath: /run/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
      volumes:
        - name: database
          secret:
            secretName: {{ .Values.secrets.database }}
            defaultMode: 0440
            items:
              - key: runtime-url
                path: runtime-url
              - key: runtime-password
                path: runtime-password
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mendicant-server
spec:
  selector:
    {{- include "mendicant.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
