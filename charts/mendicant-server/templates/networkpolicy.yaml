apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mendicant-server-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "mendicant.labels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        # Namespace and pod selectors form one peer, not two alternatives.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.argoNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server
              app.kubernetes.io/instance: {{ .Values.networkPolicy.argoInstance }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mendicant-agent
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mendicant-database-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: mendicant-mariadb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mendicant.labels" . | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.operatorNamespace }}
      ports:
        - port: 3306
          protocol: TCP
