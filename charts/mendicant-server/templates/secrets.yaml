apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.secrets.database }}
spec:
  itemPath: {{ required "onePassword.databaseItemPath is required" .Values.onePassword.databaseItemPath | quote }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.secrets.tokens }}
spec:
  itemPath: {{ required "onePassword.tokensItemPath is required" .Values.onePassword.tokensItemPath | quote }}
