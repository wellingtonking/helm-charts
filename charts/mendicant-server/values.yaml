replicaCount: 1
image:
  repository: ghcr.io/wellingtonking/app-mendicant/server
  digest: ""
  pullSecrets: []
secrets:
  database: mendicant-mariadb
  tokens: mendicant-development-tokens
onePassword:
  databaseItemPath: ""
  tokensItemPath: ""
database:
  image: docker-registry1.mariadb.com/library/mariadb:11.8.5
  storageClassName: openebs-hostpath
  storageSize: 1Gi
bootstrap:
  # A reviewed v2 configuration selects migration/seed only, preserving legacy evidence.
  v2Configuration: {}
  enableDevelopmentTrivy: false
  enabled: false
  revision: initial
networkPolicy:
  argoNamespace: argo
  argoInstance: argocd-ai01-p720
  operatorNamespace: mariadb-operator

# Enable only after the explicit schema-0008 stopped upgrade.
scheduler:
  enabled: false
  reassessmentIntervalSeconds: 86400
  databaseRefreshIntervalSeconds: 86400
  pollSeconds: 5
