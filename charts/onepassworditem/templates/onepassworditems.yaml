{{- /*
Render 1Password operator items owned by this wrapper chart.
*/ -}}
{{- $root := . -}}
{{- $onepassword := .Values.items | default dict -}}
{{- if or (not (hasKey $onepassword "enabled")) $onepassword.enabled -}}
{{- range $index, $item := ($onepassword.items | default list) }}
{{- $name := required (printf "onepassword.items[%d].name is required" $index) $item.name -}}
{{- $itemPath := required (printf "onepassword.items[%d].itemPath is required" $index) $item.itemPath -}}
{{- $secretType := coalesce $item.secretType $item.type -}}
{{- $annotations := dict -}}
{{- range $key, $value := ($onepassword.annotations | default dict) }}
{{- $_ := set $annotations $key $value -}}
{{- end }}
{{- range $key, $value := ($item.annotations | default dict) }}
{{- $_ := set $annotations $key $value -}}
{{- end }}
{{- if and (hasKey $item "autoRestart") (ne $item.autoRestart nil) }}
{{- $_ := set $annotations "operator.1password.io/auto-restart" (toString $item.autoRestart) -}}
{{- else if and (hasKey $onepassword "autoRestart") (ne $onepassword.autoRestart nil) }}
{{- $_ := set $annotations "operator.1password.io/auto-restart" (toString $onepassword.autoRestart) -}}
{{- else if and (hasKey $onepassword "autoRestartEnabled") (ne $onepassword.autoRestartEnabled nil) }}
{{- $_ := set $annotations "operator.1password.io/auto-restart" (toString $onepassword.autoRestartEnabled) -}}
{{- end }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "onepassworditem.namespace" $root | quote }}
  labels:
    {{- include "onepassworditem.labels" $root | nindent 4 }}
    app.kubernetes.io/component: onepassword-item
    {{- with $onepassword.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $item.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  itemPath: {{ $itemPath | quote }}
{{- with $secretType }}
type: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
