{{- if .Values.rbac.create }}
---
# ClusterRole granting the operator permissions to manage all topology resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: messaging-topology-manager-role
  labels:
    {{- include "rabbitmq-messaging-topology-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - rabbitmq.com
    resources:
      - bindings
      - exchanges
      - federations
      - operatorpolicies
      - permissions
      - policies
      - queues
      - schemareplications
      - shovels
      - superstreams
      - topicpermissions
      - users
      - vhosts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rabbitmq.com
    resources:
      - bindings/finalizers
      - exchanges/finalizers
      - federations/finalizers
      - operatorpolicies/finalizers
      - permissions/finalizers
      - policies/finalizers
      - queues/finalizers
      - schemareplications/finalizers
      - shovels/finalizers
      - superstreams/finalizers
      - topicpermissions/finalizers
      - users/finalizers
      - vhosts/finalizers
    verbs:
      - update
  - apiGroups:
      - rabbitmq.com
    resources:
      - bindings/status
      - exchanges/status
      - federations/status
      - operatorpolicies/status
      - permissions/status
      - policies/status
      - queues/status
      - schemareplications/status
      - shovels/status
      - superstreams/status
      - topicpermissions/status
      - users/status
      - vhosts/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - rabbitmq.com
    resources:
      - rabbitmqclusters
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - rabbitmq.com
    resources:
      - rabbitmqclusters/status
    verbs:
      - get
---
# ClusterRole allowing the metrics proxy to authenticate and authorize requests.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: messaging-topology-metrics-auth-role
  labels:
    {{- include "rabbitmq-messaging-topology-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
# ClusterRole granting read access to the /metrics endpoint.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: messaging-topology-metrics-reader
  labels:
    {{- include "rabbitmq-messaging-topology-operator.labels" . | nindent 4 }}
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
{{- end }}

