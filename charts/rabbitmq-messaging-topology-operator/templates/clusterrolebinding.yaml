{{- if .Values.rbac.create }}
---
# Binds the manager ClusterRole to the operator ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: messaging-topology-manager-rolebinding
  labels:
    {{- include "rabbitmq-messaging-topology-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: messaging-topology-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "rabbitmq-messaging-topology-operator.serviceAccountName" . }}
    namespace: {{ include "rabbitmq-messaging-topology-operator.namespace" . }}
---
# Binds the metrics-auth ClusterRole to the operator ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: messaging-topology-metrics-auth-rolebinding
  labels:
    {{- include "rabbitmq-messaging-topology-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: messaging-topology-metrics-auth-role
subjects:
  - kind: ServiceAccount
    name: {{ include "rabbitmq-messaging-topology-operator.serviceAccountName" . }}
    namespace: {{ include "rabbitmq-messaging-topology-operator.namespace" . }}
{{- end }}

